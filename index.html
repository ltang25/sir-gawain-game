<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sir Gawain and the Green Knight</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <button id="restart" type="button">Restart</button>
  <main aria-label="Game console">
    <div id="screen" role="log" aria-live="off"></div>
    <form id="command-form" autocomplete="off">
      <input id="command" type="text" aria-label="Enter your choice" disabled spellcheck="false" autocomplete="off">
    </form>
  </main>
</body>
</html>
